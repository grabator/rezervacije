<header class="head">
  <img class="mark" src="logo.jpg" [alt]="venue()?.name ?? 'Logo'" />
  <div><h1>{{ venue()?.name }}</h1><p>Izaberi event i rezerviši stol.</p></div>
</header>

<section class="hero" aria-hidden="true">
  <svg class="hookah" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="smokeBlur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="4.5" />
      </filter>
      <radialGradient id="glow" cx="50%" cy="35%" r="60%">
        <stop offset="0%" stop-color="var(--ink-soft)" stop-opacity=".16" />
        <stop offset="100%" stop-color="var(--ink-soft)" stop-opacity="0" />
      </radialGradient>
    </defs>

    <ellipse cx="110" cy="90" rx="95" ry="95" fill="url(#glow)" />

    <g class="smoke" filter="url(#smokeBlur)">
      <circle class="puff puff1" cx="110" cy="38" r="13" />
      <circle class="puff puff2" cx="106" cy="38" r="10" />
      <circle class="puff puff3" cx="114" cy="38" r="11" />
      <circle class="puff puff4" cx="109" cy="38" r="9" />
      <circle class="puff puff5" cx="112" cy="38" r="12" />
    </g>

    <g class="body" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path class="outline" d="M65,45 C57,58 60,68 90,76 L92,150 C70,160 55,180 55,205 C55,235 80,255 110,255
        C140,255 165,235 165,205 C165,180 150,160 128,150 L130,76 C160,68 163,58 155,45
        Q110,33 65,45 Z" fill="var(--surface)" />
      <ellipse cx="110" cy="93" rx="44" ry="7" fill="var(--surface-2)" />
      <path class="hose" d="M128,118 C168,122 194,138 189,172 C186,196 165,202 159,188" fill="none" />
      <circle cx="159" cy="188" r="6" fill="var(--surface-2)" />
      <circle cx="103" cy="41" r="2.4" fill="var(--ink-soft)" stroke="none" />
      <circle cx="110" cy="39" r="2.4" fill="var(--ink-soft)" stroke="none" />
      <circle cx="117" cy="41" r="2.4" fill="var(--ink-soft)" stroke="none" />
    </g>
  </svg>
</section>

<main class="list">
  @for (e of events(); track e.id) {
    <a class="ev" [routerLink]="['e', e.id]">
      <div class="d"><span>{{ e.startsAt | date: 'MMM' }}</span><b>{{ e.startsAt | date: 'd' }}</b></div>
      <div class="t"><b>{{ e.title }}</b><small>{{ e.startsAt | date: 'EEEE, HH:mm' }}</small></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  } @empty {
    <p class="empty">Trenutno nema eventova za rezervaciju. Zaprati nas na Instagramu za najave.</p>
  }
</main>
