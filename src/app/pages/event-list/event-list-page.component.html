<div class="bg-hookah" aria-hidden="true">
  <svg viewBox="0 0 400 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="smokeBlur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="10" />
      </filter>
      <radialGradient id="glow" cx="50%" cy="55%" r="55%">
        <stop offset="0%" stop-color="var(--ink-soft)" stop-opacity=".14" />
        <stop offset="100%" stop-color="var(--ink-soft)" stop-opacity="0" />
      </radialGradient>
    </defs>

    <ellipse cx="200" cy="600" rx="220" ry="320" fill="url(#glow)" />

    <g class="smoke" filter="url(#smokeBlur)">
      <circle class="puff puff1" cx="200" cy="400" r="26" />
      <circle class="puff puff2" cx="190" cy="400" r="20" />
      <circle class="puff puff3" cx="212" cy="400" r="22" />
      <circle class="puff puff4" cx="198" cy="400" r="18" />
      <circle class="puff puff5" cx="206" cy="400" r="24" />
      <circle class="puff puff6" cx="192" cy="400" r="16" />
    </g>

    <g class="silhouette" fill="var(--ink-soft)" fill-opacity=".11" stroke="none">
      <path d="M200,398 C178,398 165,415 168,432 C170,448 183,458 200,459
        C217,458 230,448 232,432 C235,415 222,398 200,398 Z" />
      <path d="M188,475 L212,475 L212,540 C212,540 300,560 300,650 C300,650 300,760 255,790
        C230,806 215,810 200,810 C185,810 170,806 145,790 C100,760 100,650 100,650
        C100,560 188,540 188,540 Z" />
      <ellipse cx="200" cy="465" rx="62" ry="9" />
    </g>

    <g class="hose" fill="none" stroke="var(--ink-soft)" stroke-opacity=".15" stroke-width="10" stroke-linecap="round">
      <path d="M212,485 C280,490 322,530 312,580 C304,618 270,632 268,660 C266,690 288,704 282,730
        C276,754 244,758 232,742" />
      <circle cx="230" cy="744" r="13" fill="var(--ink-soft)" fill-opacity=".15" stroke="none" />
    </g>
  </svg>
</div>

<header class="head">
  <img class="mark" src="logo.jpg" [alt]="venue()?.name ?? 'Logo'" />
  <div><h1>{{ venue()?.name }}</h1><p>Izaberi event i rezerviši stol.</p></div>
</header>

<main class="list">
  @for (e of events(); track e.id) {
    <a class="ev" [routerLink]="['e', e.id]">
      <div class="d"><span>{{ e.startsAt | date: 'MMM' }}</span><b>{{ e.startsAt | date: 'd' }}</b></div>
      <div class="t"><b>{{ e.title }}</b><small>{{ e.startsAt | date: 'EEEE, HH:mm' }}</small></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  } @empty {
    <p class="empty">Trenutno nema eventova za rezervaciju. Zaprati nas na Instagramu za najave.</p>
  }
</main>
