<div class="bg-hookah" aria-hidden="true">
  <svg viewBox="0 0 400 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="smokeBlur" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="10" />
      </filter>
      <radialGradient id="glow" cx="50%" cy="55%" r="55%">
        <stop offset="0%" stop-color="var(--ink-soft)" stop-opacity=".14" />
        <stop offset="100%" stop-color="var(--ink-soft)" stop-opacity="0" />
      </radialGradient>
    </defs>

    <ellipse cx="200" cy="600" rx="220" ry="320" fill="url(#glow)" />

    <g class="smoke" filter="url(#smokeBlur)">
      <circle class="puff puff1" cx="200" cy="400" r="26" />
      <circle class="puff puff2" cx="190" cy="400" r="20" />
      <circle class="puff puff3" cx="212" cy="400" r="22" />
      <circle class="puff puff4" cx="198" cy="400" r="18" />
      <circle class="puff puff5" cx="206" cy="400" r="24" />
      <circle class="puff puff6" cx="192" cy="400" r="16" />
    </g>

    <!-- cijev se crta PRIJE tijela, pa je bokal (crtan poslije, neproziran) dijelom prekriva - kao na referenci -->
    <g class="hose" fill="none" stroke="var(--ink-soft)" stroke-opacity=".15" stroke-width="11" stroke-linecap="round">
      <path d="M222,518 C300,524 344,572 330,634 C322,670 292,682 278,662
        C258,634 218,648 214,674
        C160,656 106,700 118,752 C124,778 108,796 116,816
        C160,806 216,808 248,788 C266,776 288,798 272,816" />
      <circle cx="272" cy="818" r="13" fill="var(--ink-soft)" fill-opacity=".15" stroke="none" />
    </g>

    <g class="silhouette" fill="var(--ink-soft)" fill-opacity=".12" stroke="none">
      <!-- zdjelica (gornji okrugli dio) -->
      <circle cx="200" cy="400" r="19" />
      <path d="M193,418 L207,418 L204,432 L196,432 Z" />
      <!-- tacna/poslužavnik ispod zdjelice, sa zasiljenim krajevima -->
      <path d="M104,444 Q200,417 296,444 Q200,468 104,444 Z" />
      <!-- struk (peščani sat oblik) -->
      <path d="M186,452 C178,474 172,500 180,520 C184,533 192,540 200,543
        C208,540 216,533 220,520 C228,500 222,474 214,452 Z" />
      <!-- mali ventil -->
      <path d="M216,508 L236,494 L239,499 L220,514 Z" />
      <!-- bokal (glavno tijelo) -->
      <path d="M197,541 C150,549 88,582 84,650 C80,712 106,762 132,783
        C158,802 182,810 200,810 C218,810 242,802 268,783
        C294,762 320,712 316,650 C312,582 250,549 203,541 Z" />
    </g>
  </svg>
</div>

<header class="head">
  <img class="mark" src="logo.jpg" [alt]="venue()?.name ?? 'Logo'" />
  <div><h1>{{ venue()?.name }}</h1><p>Izaberi event i rezerviši stol.</p></div>
</header>

<main class="list">
  @for (e of events(); track e.id) {
    <a class="ev" [routerLink]="['e', e.id]">
      <div class="d"><span>{{ e.startsAt | date: 'MMM' }}</span><b>{{ e.startsAt | date: 'd' }}</b></div>
      <div class="t"><b>{{ e.title }}</b><small>{{ e.startsAt | date: 'EEEE, HH:mm' }}</small></div>
      <span class="go" aria-hidden="true">›</span>
    </a>
  } @empty {
    <p class="empty">Trenutno nema eventova za rezervaciju. Zaprati nas na Instagramu za najave.</p>
  }
</main>
